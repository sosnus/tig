version: "3.9"

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${DOCKER_INFLUXDB_INIT_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}

  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      TELEGRAF_AGENT_INTERVAL: 10s

      # Output → InfluxDB v2
      TELEGRAF_OUTPUTS_INFLUXDB_V2_URLS: '["http://influxdb:8086"]'
      TELEGRAF_OUTPUTS_INFLUXDB_V2_TOKEN: ${INFLUX_TOKEN}
      TELEGRAF_OUTPUTS_INFLUXDB_V2_ORGANIZATION: ${INFLUX_ORG}
      TELEGRAF_OUTPUTS_INFLUXDB_V2_BUCKET: ${INFLUX_BUCKET}

      # Inputs
      TELEGRAF_INPUTS_CPU: "true"
      TELEGRAF_INPUTS_MEM: "true"
      TELEGRAF_INPUTS_DISK: "true"
      TELEGRAF_INPUTS_NET: "true"

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}

volumes:
  influxdb-data:
  grafana-data:
